<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AI Internship Engine</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/animations.css') }}">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            color: #eef2ff;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(circle at 15% 15%, rgba(99, 102, 241, .23), transparent 28%),
                radial-gradient(circle at 85% 20%, rgba(6, 182, 212, .15), transparent 25%),
                radial-gradient(circle at 70% 90%, rgba(139, 92, 246, .16), transparent 30%),
                #060a16;
        }

        .login-wrapper {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 25px;
        }

        .login-card {
            width: 100%;
            max-width: 480px;

            padding: 45px 42px;

            border-radius: 30px;

            background: rgba(13, 20, 38, .78);

            border: 1px solid rgba(255, 255, 255, .09);

            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);

            box-shadow:
                0 35px 100px rgba(0, 0, 0, .5),
                0 0 80px rgba(99, 102, 241, .08);
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-icon {
            width: 66px;
            height: 66px;

            margin: auto;

            display: grid;
            place-items: center;

            border-radius: 21px;

            background:
                linear-gradient(135deg,
                    rgba(99, 102, 241, .27),
                    rgba(6, 182, 212, .18));

            border: 1px solid rgba(129, 140, 248, .25);

            font-size: 30px;

            box-shadow:
                0 15px 45px rgba(99, 102, 241, .18);
        }

        .brand h1 {
            margin-top: 18px;
            margin-bottom: 8px;

            font-size: 34px;
            font-weight: 800;

            letter-spacing: -1px;

            background:
                linear-gradient(90deg,
                    #ffffff,
                    #a5b4fc,
                    #67e8f9);

            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand p {
            margin: 0;

            color: #8794b2;
            font-size: 14px;
            line-height: 1.6;
        }

        .field {
            margin-bottom: 21px;
        }

        .field label {
            display: block;

            margin-bottom: 8px;

            color: #d9e0f1;
            font-size: 13px;
            font-weight: 650;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;

            left: 16px;
            top: 50%;

            transform: translateY(-50%);

            color: #7381a2;

            pointer-events: none;
        }

        .field input {
            width: 100%;
            height: 55px;

            padding: 0 17px 0 46px;

            color: #f5f7ff;

            background: rgba(7, 13, 27, .82);

            border: 1px solid #26324c;
            border-radius: 15px;

            outline: none;

            transition: .25s ease;
        }

        .field input::placeholder {
            color: #596681;
        }

        .field input:hover {
            border-color: #3b496a;
        }

        .field input:focus {
            border-color: #7181ff;

            background: rgba(9, 16, 32, .96);

            box-shadow:
                0 0 0 4px rgba(99, 102, 241, .11),
                0 12px 30px rgba(0, 0, 0, .16);
        }

        .login-btn {
            width: 100%;
            height: 56px;

            margin-top: 8px;

            border: none;
            border-radius: 15px;

            color: white;

            font-size: 16px;
            font-weight: 750;

            background:
                linear-gradient(135deg,
                    #6366f1,
                    #8b5cf6 50%,
                    #06b6d4);

            box-shadow:
                0 15px 35px rgba(99, 102, 241, .26);

            transition: .25s ease;
        }

        .login-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 20px 45px rgba(99, 102, 241, .4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 14px;

            margin: 30px 0 22px;

            color: #53617e;
            font-size: 11px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;
            height: 1px;

            background: rgba(255, 255, 255, .09);
        }

        .register-text {
            text-align: center;

            color: #8794b2;

            font-size: 14px;
        }

        .register-text a {
            color: #a5b4fc;

            font-weight: 700;
            text-decoration: none;
        }

        .register-text a:hover {
            color: #67e8f9;
        }

        .home-link-wrap {
            margin-top: 25px;

            text-align: center;
        }

        .home-link {
            color: #687692;

            font-size: 13px;
            text-decoration: none;
        }

        .home-link:hover {
            color: #a5b4fc;
        }

        .alert {
            border-radius: 13px;
            border: 1px solid rgba(255, 255, 255, .08);
        }

        @media(max-width: 500px) {

            .login-wrapper {
                padding: 15px;
            }

            .login-card {
                padding: 35px 22px;
                border-radius: 23px;
            }

            .brand h1 {
                font-size: 28px;
            }

        }
    </style>

</head>


<body>

    <div class="login-wrapper">

        <!-- FLOATING PARTICLES -->
        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>

        <div class="login-card card-entrance">

            <!-- BRAND -->

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <h1>
                    Welcome Back
                </h1>

                <p>
                    Sign in to continue your AI-powered
                    internship journey.
                </p>

            </div>


            <!-- FLASH MESSAGES -->

            {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

            <div class="alert alert-{{ category }} mb-3">
                {{ message }}
            </div>

            {% endfor %}

            {% endwith %}


            <!-- LOGIN FORM -->

            <form method="POST" action="{{ url_for('auth.login') }}">

                <div class="field">

                    <label>
                        Email Address
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            ✉
                        </span>

                        <input type="email" name="email" placeholder="you@example.com" required>

                    </div>

                </div>


                <div class="field">

                    <label>
                        Password
                    </label>

                    <div class="input-wrap">

                        <span class="input-icon">
                            🔒
                        </span>

                        <input type="password" name="password" placeholder="Enter your password" required>

                    </div>

                </div>


                <button type="submit" class="login-btn btn-press">
                    🚀 Sign In
                </button>

            </form>


            <div class="divider">
                AI Internship Engine
            </div>


            <div class="register-text">

                Don't have an account?

                <a href="{{ url_for('auth.register') }}">
                    Create Account →
                </a>

            </div>


            <div class="home-link-wrap">

                <a href="{{ url_for('home') }}" class="home-link">
                    ← Back to Home
                </a>

            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>

</html>
