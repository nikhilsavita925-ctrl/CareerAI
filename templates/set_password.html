<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Password | CareerAI</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; display:flex; align-items:center; justify-content:center;
            padding:20px; font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif; color:white;
            background: radial-gradient(circle at 15% 10%,rgba(99,102,241,.22),transparent 30%),
                        radial-gradient(circle at 85% 90%,rgba(6,182,212,.15),transparent 30%),#060a16;
        }
        .card { width:100%; max-width:520px; padding:42px; border-radius:28px; text-align:center;
                background:rgba(13,20,38,.88); border:1px solid rgba(255,255,255,.09);
                box-shadow:0 30px 90px rgba(0,0,0,.45); }
        .icon { width:75px;height:75px;margin:0 auto 22px;display:grid;place-items:center;border-radius:22px;
                background:linear-gradient(135deg,rgba(99,102,241,.28),rgba(6,182,212,.18));font-size:32px; }
        h1 { margin:0;font-size:30px;font-weight:800; }
        p { color:#8794b2;font-size:14px;line-height:1.6;margin:13px auto 28px; }
        .field { text-align:left;margin-bottom:16px; }
        label { display:block;margin-bottom:8px;color:#d9e0f1;font-size:13px;font-weight:700; }
        input { width:100%;height:54px;padding:0 16px;border-radius:14px;border:1px solid #26324c;outline:none;
                color:#f4f7ff;background:rgba(7,13,27,.9); }
        input:focus { border-color:#7181ff;box-shadow:0 0 0 4px rgba(99,102,241,.11); }
        button { width:100%;height:55px;margin-top:10px;border:0;border-radius:14px;color:white;font-size:15px;font-weight:800;cursor:pointer;
                 background:linear-gradient(135deg,#6366f1,#8b5cf6 50%,#06b6d4); }
        .alert { padding:12px;margin-bottom:20px;border-radius:12px;background:rgba(255,255,255,.06);color:#dbe4ff;font-size:13px;text-align:left; }
        .back { display:block;margin-top:22px;color:#7381a2;text-decoration:none;font-size:13px; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon">🔐</div>
        <h1>Create Your Password</h1>
        <p>Your email has been verified. Create a password to finish setting up your CareerAI account.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="alert">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="{{ url_for('auth.set_password') }}">
            <div class="field">
                <label>Password</label>
                <input type="password" name="password" minlength="6" placeholder="Create a password" required autofocus>
            </div>
            <div class="field">
                <label>Confirm Password</label>
                <input type="password" name="confirm_password" minlength="6" placeholder="Confirm your password" required>
            </div>
            <button type="submit">✓ Create My Account</button>
        </form>
        <a href="{{ url_for('auth.register') }}" class="back">← Start registration again</a>
    </div>
</body>
</html>
