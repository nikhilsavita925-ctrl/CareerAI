<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Verify Email | AI Internship Engine</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 20px;

            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 15% 10%,
                    rgba(99, 102, 241, .22),
                    transparent 30%
                ),
                radial-gradient(
                    circle at 85% 90%,
                    rgba(6, 182, 212, .15),
                    transparent 30%
                ),
                #060a16;
        }


        .card {

            width: 100%;

            max-width: 520px;

            padding: 42px;

            text-align: center;

            border-radius: 28px;

            background:
                rgba(13, 20, 38, .88);

            border:
                1px solid rgba(255,255,255,.09);

            box-shadow:
                0 30px 90px rgba(0,0,0,.45);
        }


        .icon {

            width: 75px;

            height: 75px;

            margin: 0 auto 22px;

            display: grid;

            place-items: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    rgba(99,102,241,.28),
                    rgba(6,182,212,.18)
                );

            border:
                1px solid rgba(129,140,248,.25);

            font-size: 32px;
        }


        h1 {

            margin: 0;

            font-size: 30px;

            font-weight: 800;
        }


        .description {

            margin: 13px auto 28px;

            color: #8794b2;

            font-size: 14px;

            line-height: 1.6;
        }


        .email {

            color: #a5b4fc;

            font-weight: 700;
        }


        .otp {

            width: 100%;

            height: 60px;

            padding: 0 20px;

            text-align: center;

            letter-spacing: 10px;

            font-size: 25px;

            font-weight: 800;

            color: white;

            background: rgba(7,13,27,.9);

            border: 1px solid #26324c;

            border-radius: 15px;

            outline: none;
        }


        .otp:focus {

            border-color: #7181ff;

            box-shadow:
                0 0 0 4px rgba(99,102,241,.11);
        }


        .verify-btn {

            width: 100%;

            height: 55px;

            margin-top: 20px;

            border: 0;

            border-radius: 14px;

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    #6366f1,
                    #8b5cf6 50%,
                    #06b6d4
                );

            transition: .25s ease;
        }


        .verify-btn:hover {

            transform: translateY(-2px);

            filter: brightness(1.08);
        }


        .back {

            display: block;

            margin-top: 22px;

            color: #7381a2;

            text-decoration: none;

            font-size: 13px;
        }


        .back:hover {

            color: #a5b4fc;
        }


        .alert {

            padding: 12px;

            margin-bottom: 20px;

            border-radius: 12px;

            background: rgba(255,255,255,.06);

            color: #dbe4ff;

            font-size: 13px;
        }


        @media(max-width: 600px) {

            .card {

                padding: 30px 20px;
            }

            h1 {

                font-size: 26px;
            }
        }

    </style>

</head>


<body>

    <div class="card">

        <div class="icon">
            ✉️
        </div>


        <h1>
            Verify Your Email
        </h1>


        <p class="description">

            We've sent a 6-digit verification code to

            <br>

            <span class="email">
                {{ email }}
            </span>

            <br><br>

            Enter the OTP below to complete your registration.

        </p>


        {% with messages = get_flashed_messages(with_categories=true) %}

            {% for category, message in messages %}

                <div class="alert">
                    {{ message }}
                </div>

            {% endfor %}

        {% endwith %}


        <form
            method="POST"
            action="{{ url_for('auth.verify_otp') }}"
        >

            <input
                type="text"
                name="otp"
                class="otp"
                placeholder="000000"
                maxlength="6"
                minlength="6"
                pattern="[0-9]{6}"
                inputmode="numeric"
                autocomplete="one-time-code"
                required
            >


            <button
                type="submit"
                class="verify-btn"
            >
                ✓ Verify Email
            </button>

        </form>


        <form method="POST" action="{{ url_for('auth.resend_otp') }}" style="margin-top:14px;">
            <button type="submit" style="background:transparent;border:0;color:#a5b4fc;font-weight:700;cursor:pointer;">
                ↻ Resend OTP
            </button>
        </form>

        <a
            href="{{ url_for('auth.register') }}"
            class="back"
        >
            ← Back to Registration
        </a>

    </div>

</body>

</html>
